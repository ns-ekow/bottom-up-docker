# ---------------------------------------------------------------- T1: kernel + man pages

[[source]]
id = "kernel-doc"
title = "Linux v7.0.14 kernel documentation (cgroup v2, overlayfs, seccomp filter)"
tier = "T1"
kind = "src"
repo = "linux"
paths = [
  "Documentation/admin-guide/cgroup-v2.rst",
  "Documentation/filesystems/overlayfs.rst",
  "Documentation/userspace-api/seccomp_filter.rst",
]
license = "GPL-2.0"

[[source]]
id = "man"
title = "Linux man-pages 6.17, iproute2 6.19, util-linux 2.41 (as installed in the lab VM)"
tier = "T1"
kind = "man"
pages = [
  # namespaces
  "namespaces.7", "pid_namespaces.7", "user_namespaces.7", "mount_namespaces.7",
  "network_namespaces.7", "uts_namespaces.7", "ipc_namespaces.7", "cgroup_namespaces.7",
  "time_namespaces.7", "clone.2", "unshare.2", "setns.2", "unshare.1", "nsenter.1",
  # filesystem view
  "pivot_root.2", "chroot.2", "mount.2", "umount.2", "mount.8",
  # resources, identity, privilege
  "cgroups.7", "capabilities.7", "credentials.7", "seccomp.2", "prctl.2",
  # system calls and files
  "intro.2", "syscalls.2", "open.2",
  # processes and signals
  "execve.2", "fork.2", "wait.2", "signal.7", "pidfd_open.2", "proc.5",
  # networking
  "veth.4", "ip-netns.8", "ip-link.8",
]
license = "man-pages project licenses (verbatim redistribution permitted); rendered locally, not committed"

