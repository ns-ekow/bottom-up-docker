# bottom-up-docker accuracy corpus. See PLAN.md §5.
#
# Every source the course may cite. tools/fetch-corpus turns each entry into normalized markdown
# under corpus/cache/ (gitignored; reproducible) and records hashes in corpus/manifest.lock.
#
# tier:  T1 authoritative (can be sole citation)
#        T2 expert secondary (explanation/history; behavioral claims also need T1 or an experiment)
#        T3 context only (never sole citation)
# kind:  src   files inside a pinned repo under src/ (already frozen by pins.lock)
#        git   another repo, frozen at `commit`, sparse `paths`
#        man   man pages rendered inside the lab VM (so they match its userland)
#        url   a web page; `title` must match the fetched <title> or the fetch fails
#        pdf   a local file under corpus/private/books/ (never committed)
# ID scheme for citations: <id>:<file>#<heading-anchor>, e.g. oci-runtime:config.md#mounts

# ---------------------------------------------------------------- T1: specifications

[[source]]
id = "oci-runtime"
title = "OCI Runtime Specification v1.3.0"
tier = "T1"
kind = "src"
repo = "runtime-spec"
paths = ["*.md"]
license = "Apache-2.0"

