# bottom-up-docker curriculum: the single source of truth.
#
# The site's front page and /curriculum/ page are generated from this file, and
# tools/check-curriculum enforces it against the lessons:
#   - every `read` path exists at the pinned commit (repo:path, repo as in pins.lock)
#   - every `sources` entry is a corpus source id from corpus/manifest.toml
#   - every lesson in site/src/content/docs/modules/ is <id>-*.mdx for a module listed here, and
#     its title and question match; nothing is taught outside the curriculum
#   - a module that is drafting or later has exactly one lesson, which shows <ModuleHeader id=".." />
#   - once a module's status is "review" or "published", its lesson has all seven anatomy sections
#
# status: planned -> drafting -> review -> published
# Edit the curriculum here, never on the site or in PLAN.md.

title = "bottom-up-docker"
weeks = "15 weeks: 12 core + 3 extension"
anatomy = ["Question", "Concept", "Experiment", "Build", "Read", "Trace", "Exercise"]
out_of_scope = [
  "Windows containers and Hyper-V isolation",
  "Docker Desktop internals (its VM, file sharing, extensions)",
  "Docker Model Runner / AI features",
  "Swarm beyond an overview; Kubernetes beyond the CRI boundary",
  "Writing production Dockerfiles for specific languages (plenty of material exists)",
]

[[part]]
id = "foundations"
title = "I · Foundations"
summary = "What the kernel gives a process, and how containers differ from VMs."

[[part]]
id = "isolation"
title = "II · Isolation primitives"
summary = "The kernel features a container is made of: namespaces, cgroups and union filesystems."

[[part]]
id = "standard"
title = "III · The container standard"
summary = "Turn the primitives into an OCI runtime, and learn what an image actually is."

[[part]]
id = "network"
title = "IV · Networking"
summary = "From a lone network namespace to published ports, service discovery and multi-host overlays."

[[part]]
id = "engine"
title = "V · The engine"
summary = "How dockerd, containerd, the shim and runc cooperate, and how BuildKit builds images."

[[part]]
id = "hardening"
title = "VI · Hardening and operations"
summary = "What stands between a container and the host, and how state, lifecycle and plugins work."

[[part]]
id = "beyond"
title = "VII · Beyond Docker"
summary = "Other runtimes, contributing upstream, and your own engine."

# ============================================================================ modules

[[module]]
id = "01"
part = "foundations"
week = 1
title = "Processes and the kernel boundary"
question = "What is a process, what does the kernel give it, and why is PID 1 special?"
objectives = [
  "Explain the user/kernel boundary and trace the syscalls a program makes",
  "Describe fork, exec, wait, file descriptors and signals in terms of kernel state",
  "Explain zombies and orphans, and why PID 1 must reap them",
]
experiment = "strace a small program; walk /proc/self; create zombies and watch them get reaped."
build = "bud-init: a minimal PID 1 that forwards signals and reaps zombies"
read = ["linux:kernel/fork.c", "linux:kernel/exit.c", "containerd:pkg/sys/reaper/reaper_unix.go"]
trace = "strace -f of a fork/exec/wait program"
sources = ["man"]
status = "planned"

[[module]]
id = "02"
