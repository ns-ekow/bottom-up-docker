  "Place chroot, jails, zones, LXC, libcontainer and runc on one timeline",
  "State the one sentence that defines a container: processes sharing a host kernel, isolated by namespaces and limited by cgroups",
]
experiment = "Compare boot time and memory of the lab VM against a container doing the same job."
build = "None (short, context-setting module)"
read = []
trace = "None"
sources = ["codementor", "saigon", "poulton", "lwn-ns1"]
status = "planned"

[[module]]
